display_information:
  name: Qcode
  description: Share Qcode messages and attachments using your own Slack account
  background_color: "#252938"
oauth_config:
  redirect_urls:
    - https://localhost:3443/oauth/callback
  scopes:
    user:
      - chat:write
      - files:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
